research:
  - title: "Execution-Aware DRAM Scheduling for Edge-AI Applications"
    date: "Jan 2026"
    featured: true
    tags: [DRAM, Memory Scheduling, Near-Memory Computing, DDR5]
    venue: "Micron Memory Awards (Taiwan) · two-person team"
    description: "Tackles the memory wall in AI systems — where DRAM rather than compute limits performance and energy — with an execution-aware DRAM scheduling architecture for near-memory AI accelerators."
    highlights:
      - "Evaluated with Ramulator (DRAM) and SCALE-Sim (accelerator) under JEDEC-compliant timing constraints; compatible with DDR5."
      - "~50% reduction in DRAM activity and up to 33% energy savings."

  - title: "Energy-Efficient Near-Memory Systolic Accelerator with On-Chip Weight Compression"
    date: "2026"
    featured: true
    tags: [AI Accelerator, Systolic Array, Near-Memory, Verilog]
    description: "Near-memory systolic-array accelerator for edge-AI workloads that compresses weights on-chip to cut off-chip memory traffic and energy."
    repo: "https://github.com/santoshmokashi86/near_memory_systolic_accelerator"

  - title: "FPGA-Accelerated RISC-V ISA Extensions for Neural Network Inference"
    date: "2025"
    featured: true
    tags: [RISC-V, FPGA, ISA Extensions, Edge AI]
    description: "Custom FPGA-accelerated RISC-V system on a Xilinx PYNQ-Z2 with neural-network ISA extensions written in SystemVerilog; timing closure in Vivado."
    highlights:
      - "2.14× average latency speedup and 49.1% energy reduction on real hardware."
    links:
      - { name: "Paper", url: "https://arxiv.org/abs/2511.06955" }

  - title: "AHB/APB Micro-architecture for a RISC-V SoC"
    date: "Jan 2025 – Jan 2026"
    featured: true
    tags: [AMBA AHB, APB, SoC, RTL]
    venue: "CHIPS, PES University · with the VLSI Society of India"
    description: "Contributed RTL for the AHB protocol micro-architecture of a RISC-V-based SoC for embedded applications, and integrated an AHB–APB bus connecting three IP blocks at 100 MHz."
    repo: "https://github.com/santoshmokashi86/AHB-Protocol"

  - title: "PUF-Keyed Authenticated In-Modulator Encryption for Delta-Sigma Sensors"
    date: "2026"
    tags: [Hardware Security, PUF, Delta-Sigma, SKY130]
    description: "Authenticated encryption keyed by a PUF and embedded within a delta-sigma sensor modulator, in the open-source SKY130 process. Submitted to IEEE ISCAS 2027."

