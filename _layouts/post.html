---
layout: default
---
<small>{{ page.date | date: "%Y-%m-%d" }}</small>
<h1>{{ page.title }}</h1>
<p class="view">by {{ page.author | default: site.author }}</p>
{{ content }}
{% if page.tags %}<small>tags: <em>{{ page.tags | join: "</em> · <em>" }}</em></small>{% endif %}
<p><a href="{{ "/blog.html" | relative_url }}">&larr; All posts</a></p>
